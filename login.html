<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LaundryWallah</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <button id="theme-toggle" class="floating-theme-btn" title="Toggle Dark Mode">🌙</button>

    <div class="login-container">
        <div class="left-section">
            <img src="https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=600&q=80" alt="Laundry Illustration">
        </div>

        <div class="right-section">
            <div class="form-content">
                <h2>Hello Again!</h2>
                <p class="subtitle">Welcome back! Please login to your account.</p>

                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="xyz@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Password" required>
                    </div>

                    <div class="form-actions">
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="login-btn">Login</button>
                </form>

                <p class="signup-text">Not a member? <a href="#">Register Now</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
